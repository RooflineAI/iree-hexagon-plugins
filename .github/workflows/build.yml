name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af
          df -h

      - name: Install clang-19
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform-tools and NDK 28
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android
        run: |
          adb version
          echo $ANDROID_NDK_HOME
          ls $ANDROID_NDK_HOME

      - name: Apply patches
        run: |
          build_tools/apply_iree_patches.sh

      - name: Configure bazelrc
        run: |
          cat - >configured.bazelrc <<EOF
          build --action_env CC=/usr/lib/llvm-19/bin/clang
          build --action_env CXX=/usr/lib/llvm-19/bin/clang++
          build --config=generic_clang
          build --incompatible_strict_action_env
          EOF

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: |
          # The current CI runner is quite slow and does not finish an entire build in 10h, so don't even try and limit to 5m.
          timeout 5m bazel build @iree_core//tools/...

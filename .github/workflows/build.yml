name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` catches a stacked PR being retargeted onto main once the PR
    # below it merges; other edits (title, body) are filtered out below.
    types: [opened, synchronize, reopened, edited]
concurrency:
  # Edits that are not a retarget get their own group, so renaming a PR does
  # not cancel its in-flight run.
  group: ${{ github.workflow }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pre-commit:
    # Only run for pushes and for PRs at the bottom of a stack, i.e. based on
    # main. The `branches` filter above does not exclude GitHub-native stacked
    # PRs, so check the base ref here. Every other job depends on this one
    # and is skipped along with it.
    if: github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && (github.event.action != 'edited' || github.event.changes.base))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: false
      - name: Run pre-commit checks
        run: |
          # TEMPORARY: actionlint skipped while debugging the profile run failure.
          SKIP=actionlint uvx pre-commit run --all-files --show-diff-on-failure
  build-cmake:
    # TEMPORARY: disabled while debugging the profile run failure in test-bazel.
    if: false
    needs:
      - pre-commit
      - build-bazel # don't run cmake build if bazel build fails (save CI time)
    runs-on:
      group: qualcomm
      labels: qc-large
    steps:
      - uses: actions/checkout@v4
      - name: Build and package with CMake+Ninja
        run: |
          build_tools/cmake/all_in_one.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-cmake
          path: build-artifacts-cmake
          retention-days: 1
  test-cmake:
    needs:
      - build-cmake
      - test-bazel # avoid concurrent test jobs within same run
    runs-on:
      group: qualcomm
      labels: qc-small
    # Stopgap mutex for the single phone: qc-small is a pool, so the runner
    # label does not stop two test jobs from reaching the phone at once. Jobs
    # sharing this group run one at a time, across workflow runs. Fork PRs
    # never touch the phone, so they get a per-run group and do not queue.
    # Caveat: a group holds one running and one pending job, so a further
    # queued job cancels the pending one even with cancel-in-progress false.
    concurrency: &phone_lock
      group: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'phone-1' || format('no-phone-{0}-{1}', github.run_id, github.job) }}
      cancel-in-progress: false
    env:
      # Fork PRs never receive secrets, so they cannot hold an overlay key and
      # cannot reach the phone. That is the boundary working as intended, not
      # something to route around: pull_request_target would hand a fork's code
      # our credentials. Forks still get the full build, just no device steps.
      PHONE_ACCESS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-cmake
          path: build-artifacts
      - &prep_build_artifacts
        name: Prepare build artifacts
        run: |
          # The compiler tools travel as one zip (bin/ and lib/, the tools
          # find libIREECompiler.so through the rpath $ORIGIN/../lib).
          # Unpacking it restores the executable bits that artifact upload
          # drops.
          unzip -q build-artifacts/hexagon_compiler_x86_64_linux.zip \
            -d build-artifacts/hexagon_compiler_x86_64_linux
          ls -lR build-artifacts
      - &install_pinned_platform_tools
        name: Install pinned platform-tools
        env:
          PLATFORM_TOOLS_VERSION: "37.0.1"
          PLATFORM_TOOLS_SHA256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
        run: |
          # Deliberately NOT `sdkmanager --install platform-tools`, which always
          # fetches the newest release. adb refuses to work across a
          # client/server version gap: on mismatch the client kills the server
          # and starts its own. Harmless when both live on one machine, fatal
          # here, where the server runs on the phone rig at the far end of the
          # tunnel and cannot be restarted from this job. It would also take the
          # phone away from every other job until systemd restarted it.
          # Keep in lockstep with platform_tools_version in provision-servers,
          # ansible/inventory/group_vars/phone_public.yml.
          zip="platform-tools_r${PLATFORM_TOOLS_VERSION}-linux.zip"
          curl -fsSLO "https://dl.google.com/android/repository/${zip}"
          echo "${PLATFORM_TOOLS_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" -d "${RUNNER_TEMP}"
          # Appended last so it precedes the SDK's own copy on PATH.
          echo "${RUNNER_TEMP}/platform-tools" >> "$GITHUB_PATH"
      - &verify_android
        name: Verify Android
        run: |
          adb version
          echo "$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME"
      - &join_phone_overlay
        name: Join the phone overlay
        if: env.PHONE_ACCESS == 'true'
        env:
          TS_AUTHKEY: ${{ secrets.HEADSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::HEADSCALE_AUTHKEY is unset, so this job cannot reach the phone. See the comment below this check for how to mint it."
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh

          # The key is ephemeral, so this node deletes itself on disconnect and
          # the control plane does not accumulate one dead node per CI run.
          #
          # HEADSCALE_AUTHKEY EXPIRES 2027-08-25.
          #
          # Nothing warns before that date. The join below simply starts
          # failing, and it looks like a network fault rather than an expiry.
          # To renew, on vpn.cloud.rfldev.de, and then UPDATE THE DATE ABOVE:
          #   headscale preauthkeys create --user 4 --tags tag:gha-runner \
          #     --ephemeral --reusable --expiration 8760h
          #   gh secret set HEADSCALE_AUTHKEY --repo RooflineAI/iree-hexagon-plugins
          # --accept-dns=false: we address the rig by its literal overlay IP, so
          # there is nothing to gain from MagicDNS, and hosted runners already
          # carry enough search domains that setting it fails noisily with
          # "Too many search domains per link". Leaving the runner's resolver
          # alone avoids an alarming log line that means nothing.
          if ! sudo tailscale up \
            --login-server=https://vpn.cloud.rfldev.de \
            --authkey="$TS_AUTHKEY" \
            --accept-dns=false \
            --hostname="gha-${GITHUB_RUN_ID}"; then
            echo "::error::Could not join the overlay. The most likely cause is an expired HEADSCALE_AUTHKEY, which was due to lapse on 2027-08-25. Re-mint it and update the date in .github/workflows/build.yml; the exact commands are in the comment above this step."
            exit 1
          fi
          tailscale status
      - &point_adb_at_phone_rig
        name: Point adb at the phone rig
        if: env.PHONE_ACCESS == 'true'
        run: |
          # The rig runs the adb server; this job must never start its own.
          # ANDROID_SERIAL is redundant with a single phone attached and becomes
          # load-bearing the moment a second one is.
          echo "ADB_SERVER_SOCKET=tcp:100.64.0.2:5037" >> "$GITHUB_ENV"
          echo "ANDROID_SERIAL=2c82b852" >> "$GITHUB_ENV"
          # The rig is ~220 ms away over the tailnet (OPS-1076). A single adb
          # push flow under CUBIC collapses on any loss there (1.7 to 10.7 MB/s
          # observed); BBR holds 26 MB/s, and the larger buffers cover the
          # bandwidth-delay product.
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_wmem="4096 131072 16777216" net.ipv4.tcp_rmem="4096 131072 16777216"
      - &check_phone_reachable
        name: Check the phone is reachable
        if: env.PHONE_ACCESS == 'true'
        run: |
          adb devices -l
          # Reading the two failure modes: `unauthorized` means the phone has
          # dropped its trust of the rig's key and someone has to tap Always
          # allow on the device itself; `device not found` means something on
          # the rig is holding the phone's USB interface, usually a stray adb
          # server left behind by a bare `adb` command run there.
          adb shell getprop ro.product.model
      - &install_uv
        name: Install UV
        if: env.PHONE_ACCESS == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
          enable-cache: false
      - &setup_test_env
        name: Setup environment for integration tests
        if: env.PHONE_ACCESS == 'true'
        run: |
          build_tools/create_test_venv.sh
      - &integration_tests
        name: Integration tests
        if: env.PHONE_ACCESS == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
        run: |
          .venv/bin/pytest integration_tests/ -v -rA \
          --iree-compile=build-artifacts/hexagon_compiler_x86_64_linux/bin/iree-compile \
          --runtime-zip=build-artifacts/hexagon_runtime_aarch64_android.zip \
          --runtime-zip-tracy=build-artifacts/hexagon_runtime_aarch64_android_tracy.zip \
          --device-tools-zip=build-artifacts/device_tools_aarch64_android.zip \
          --lld=build-artifacts/hexagon_compiler_x86_64_linux/bin/ld.lld
      - &leave_overlay
        name: Leave the overlay
        if: always()
        run: sudo tailscale logout || true
  build-bazel:
    needs:
      - pre-commit
    runs-on:
      group: qualcomm
      labels: qc-large
    steps:
      - uses: actions/checkout@v4
      - name: Update submodules
        run: |
          build_tools/update_submodules.py
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install NDK 28
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Setup bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build, package, test
        run: |
          build_tools/bazel/build_and_package.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-bazel
          path: build-artifacts-bazel
          retention-days: 1
  test-bazel:
    needs:
      - build-bazel
    runs-on:
      group: qualcomm
      labels: qc-small
    concurrency: *phone_lock
    env:
      # Fork PRs never receive secrets, so they cannot hold an overlay key and
      # cannot reach the phone. That is the boundary working as intended, not
      # something to route around: pull_request_target would hand a fork's code
      # our credentials. Forks still get the full build, just no device steps.
      PHONE_ACCESS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-bazel
          path: build-artifacts
      - *prep_build_artifacts
      - *install_pinned_platform_tools
      - *verify_android
      - *join_phone_overlay
      - *point_adb_at_phone_rig
      - *check_phone_reachable
      - *install_uv
      - *setup_test_env
      # TEMPORARY: only the failing profile case, with the case directory kept
      # on the device for the step below.
      - name: Integration tests (profile debug)
        if: env.PHONE_ACCESS == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CI }}
          DEBUG_LOGS_DIR: /data/local/tmp/hexagon_it_profile_debug
        run: |
          adb shell rm -rf "$DEBUG_LOGS_DIR"
          .venv/bin/pytest integration_tests/ -v -rA \
          --model micro/parallel-conv-max-1x32x64x64-f16 \
          -k "hexagon-sequential-profile" \
          --keep-device-dir \
          --device-root="$DEBUG_LOGS_DIR" \
          --iree-compile=build-artifacts/hexagon_compiler_x86_64_linux/bin/iree-compile \
          --runtime-zip=build-artifacts/hexagon_runtime_aarch64_android.zip \
          --runtime-zip-tracy=build-artifacts/hexagon_runtime_aarch64_android_tracy.zip \
          --device-tools-zip=build-artifacts/device_tools_aarch64_android.zip \
          --lld=build-artifacts/hexagon_compiler_x86_64_linux/bin/ld.lld
      - name: Collect profile debug info
        if: always() && env.PHONE_ACCESS == 'true'
        env:
          DEBUG_LOGS_DIR: /data/local/tmp/hexagon_it_profile_debug
        run: |
          set +e
          # The full logcat of the profile run: the harness only keeps adsprpc,
          # which drops the debuggerd backtrace (DEBUG) and libc messages.
          echo "::group::logcat of the pytest run, all tags"
          adb logcat -d
          echo "::endgroup::"
          echo "::group::logcat crash buffer"
          adb logcat -d -b crash
          echo "::endgroup::"

          echo "::group::device state"
          adb shell 'id; getprop ro.serialno; getprop ro.build.fingerprint; getprop ro.build.type; getprop ro.debuggable; getprop ro.secure; getprop service.adb.root'
          adb shell 'echo perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)'
          adb shell 'ls -ld /sys/kernel/tracing /sys/kernel/debug/tracing 2>&1'
          adb shell 'ps -A | grep -E "iree|tracy|limit_lifetime"'
          adb shell 'netstat -ltn 2>/dev/null || ss -ltn' | grep -E ':80(8[6-9]|9[0-9]|10[0-5]) ' || echo "nothing listening on 8086-8105"
          echo "::endgroup::"

          tracy_dir=$(adb shell "ls -d $DEVICE_ROOT/runs/*/bin/tracy-capture" | tr -d '\r' | head -1)
          tracy_dir=${tracy_dir%/bin/tracy-capture}
          case_dir=$(adb shell "ls -d $tracy_dir/cases/*" | tr -d '\r' | head -1)
          echo "tracy deployment: $tracy_dir, case: $case_dir"

          echo "::group::case directory"
          adb shell "ls -la $case_dir"
          for f in profile.exit_codes capture.log csvexport.log; do
            echo "--- $f"
            adb shell "cat $case_dir/$f" | tr '\r' '\n'
          done
          echo "::endgroup::"

          mkdir -p profile-debug
          adb pull "$case_dir" profile-debug/

          # Rerun the case by hand to tell apart whether the crash needs a
          # connected capture: once with no capture and without TRACY_NO_EXIT,
          # once with the capture as the harness runs it.
          run="cd $case_dir && export DSP_LIBRARY_PATH=$tracy_dir/lib/hexagon && "
          argv="$tracy_dir/bin/iree-run-module --module=module.vmfb --function=main --device=hexagon --input=@input0.npy --output=@rerun_output0.npy --hexagon_max_concurrent_dispatches=1"
          echo "::group::rerun: no capture"
          adb logcat -c
          adb shell "$run TRACY_PORT=8086 $argv; echo run_exit=\$?"
          adb logcat -d -s DEBUG libc tracy
          echo "::endgroup::"
          echo "::group::rerun: with capture"
          adb logcat -c
          adb shell "$run { $tracy_dir/bin/tracy-capture -o rerun.tracy -f -p 8086 > rerun_capture.log 2>&1 & cp=\$!; TRACY_NO_EXIT=1 TRACY_PORT=8086 $argv; echo run_exit=\$?; sleep 2; kill \$cp 2>/dev/null; wait \$cp; echo capture_exit=\$?; tr '\r' '\n' < rerun_capture.log | tail -40; }"
          adb logcat -d -s DEBUG libc tracy
          echo "::endgroup::"

          adb pull "$case_dir" profile-debug/rerun
          adb shell rm -rf "$DEVICE_ROOT"
          exit 0
      - name: Upload profile debug info
        if: always() && env.PHONE_ACCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: profile-debug
          path: profile-debug
          retention-days: 3
      - *leave_overlay
  release:
    needs:
      - pre-commit
      - build-bazel
      - test-bazel
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-bazel
          path: build-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.0.$(date +%Y%m%d.%H%M%S)"
          git_hash="$(git rev-list -1 HEAD)"
          zip_name="iree-hexagon-plugins-${version}_${git_hash:0:10}_x86_64_linux_aarch64_android.zip"
          zip -j "${zip_name}" build-artifacts/*
          gh release create "v${version}" "${zip_name}" \
            --target "${git_hash}" \
            --title "v${version}" \
            --notes "git hash ${git_hash}, github run id ${{ github.run_id }}"
  gatekeeper:
    needs:
      - pre-commit
      - test-cmake
      - test-bazel
    # always(): without it a skipped or failed dependency skips this job, and
    # GitHub treats a skipped required check as passing. The remaining
    # condition mirrors pre-commit: runs that skip on purpose (stacked PRs,
    # title/body edits) have nothing to gate.
    if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.base.ref == 'main' && (github.event.action != 'edited' || github.event.changes.base)))
    runs-on: ubuntu-24.04
    steps:
      - name: gatekeeper
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed (failed, cancelled or skipped)."
              exit 1
            fi
          done

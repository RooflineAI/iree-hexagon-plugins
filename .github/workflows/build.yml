name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Deliberately no `edited`: title and body edits must not start a run.
    # A stacked PR that becomes the bottom of its stack gets its run from the
    # push that rebases it onto main once the PR below it merges.
    types: [opened, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The device tests need the overlay key and the Hugging Face token.
    secrets: inherit
    # Upper bound for the nested jobs, which may request less.
    permissions:
      contents: read
      actions: read
  release:
    # Waits for all of CI, so a failing CMake build or test also holds back
    # the release.
    needs:
      - ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-bazel
          path: build-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.0.$(date +%Y%m%d.%H%M%S)"
          git_hash="$(git rev-list -1 HEAD)"
          zip_name="iree-hexagon-plugins-${version}_${git_hash:0:10}_x86_64_linux_aarch64_android.zip"
          zip -j "${zip_name}" build-artifacts/*
          gh release create "v${version}" "${zip_name}" \
            --target "${git_hash}" \
            --title "v${version}" \
            --notes "git hash ${git_hash}, github run id ${{ github.run_id }}"

name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited` catches a stacked PR being retargeted onto main once the PR
    # below it merges; other edits (title, body) are filtered out by the `ci`
    # job's condition below.
    types: [opened, synchronize, reopened, edited]
concurrency:
  # Edits that are not a retarget get their own group, so renaming a PR does
  # not cancel its in-flight run.
  group: ${{ github.workflow }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    # A title or body edit starts a run on the same commit as the PR's real
    # run, and a PR shows the result that finished last for each check name.
    # Were the CI jobs skipped one by one here, their "skipped" results would
    # overwrite the real ones, the required gatekeeper among them, and GitHub
    # treats a skipped required check as passing. Skipping this caller job
    # instead reports only a check named "ci", so the real results stand.
    if: github.event.action != 'edited' || github.event.changes.base
    uses: ./.github/workflows/ci.yml
    # The device tests need the overlay key and the Hugging Face token.
    secrets: inherit
    # Upper bound for the nested jobs, which may request less.
    permissions:
      contents: read
      actions: read
  release:
    # Waits for all of CI, so a failing CMake build or test also holds back
    # the release.
    needs:
      - ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-bazel
          path: build-artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.0.$(date +%Y%m%d.%H%M%S)"
          git_hash="$(git rev-list -1 HEAD)"
          zip_name="iree-hexagon-plugins-${version}_${git_hash:0:10}_x86_64_linux_aarch64_android.zip"
          zip -j "${zip_name}" build-artifacts/*
          gh release create "v${version}" "${zip_name}" \
            --target "${git_hash}" \
            --title "v${version}" \
            --notes "git hash ${git_hash}, github run id ${{ github.run_id }}"

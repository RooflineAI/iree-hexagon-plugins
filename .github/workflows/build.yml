name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      group: qualcomm
      labels: qc-large
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang-19
        run: |
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 19

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 28
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Apply patches
        run: |
          build_tools/apply_submodule_patches.sh

      - name: Configure bazelrc
        run: |
          cat - >configured.bazelrc <<EOF
          build --action_env CC=/usr/lib/llvm-19/bin/clang
          build --action_env CXX=/usr/lib/llvm-19/bin/clang++
          build --config=generic_clang
          build --incompatible_strict_action_env
          EOF

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true


      - name: Build
        run: |
          TARGETS=(
            @iree//tools:iree-compile
            @iree//tools:iree-dump-module
            @iree//tools:iree-dump-parameters
            @iree//tools:iree-encode-parameters
            @iree//tools:iree-opt
            @iree//tools:iree-run-module
            @iree//tools:iree-benchmark-module
            @llvm-project//lld:ld.lld
            //plugins/runtime/hexagon:hexagon_runtime_aarch64_android
            //plugins/runtime/hexagon:hexagon_runtime_aarch64_android_tracy
          )
          bazel build --verbose_failures "${TARGETS[@]}"
          mkdir build-artifacts
          for TARGET in "${TARGETS[@]}"
          do
            cp $(bazel cquery --output=files "$TARGET") build-artifacts
          done
          chmod -R u+w build-artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts
          retention-days: 1

  test:
    needs: build
    runs-on:
      group: qualcomm
      labels: qc-small
    env:
      # Fork PRs never receive secrets, so they cannot hold an overlay key and
      # cannot reach the phone. That is the boundary working as intended, not
      # something to route around: pull_request_target would hand a fork's code
      # our credentials. Forks still get the full build, just no device steps.
      PHONE_ACCESS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts

      - name: List build artifacts
        run: find build-artifacts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned platform-tools
        env:
          PLATFORM_TOOLS_VERSION: "37.0.1"
          PLATFORM_TOOLS_SHA256: d230f13842f60f782a8645f9c813f8f845bf36089ea7289f28c48f17979313f1
        run: |
          # Deliberately NOT `sdkmanager --install platform-tools`, which always
          # fetches the newest release. adb refuses to work across a
          # client/server version gap: on mismatch the client kills the server
          # and starts its own. Harmless when both live on one machine, fatal
          # here, where the server runs on the phone rig at the far end of the
          # tunnel and cannot be restarted from this job. It would also take the
          # phone away from every other job until systemd restarted it.
          # Keep in lockstep with platform_tools_version in provision-servers,
          # ansible/inventory/group_vars/phone_public.yml.
          zip="platform-tools_r${PLATFORM_TOOLS_VERSION}-linux.zip"
          curl -fsSLO "https://dl.google.com/android/repository/${zip}"
          echo "${PLATFORM_TOOLS_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "${zip}" -d "${RUNNER_TEMP}"
          # Appended last so it precedes the SDK's own copy on PATH.
          echo "${RUNNER_TEMP}/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android
        run: |
          adb version
          echo $ANDROID_NDK_HOME
          ls $ANDROID_NDK_HOME

      - name: Configure bazelrc
        run: |
          cat - >configured.bazelrc <<EOF
          build --action_env CC=/usr/lib/llvm-19/bin/clang
          build --action_env CXX=/usr/lib/llvm-19/bin/clang++
          build --config=generic_clang
          build --incompatible_strict_action_env
          EOF

      - name: Join the phone overlay
        if: env.PHONE_ACCESS == 'true'
        env:
          TS_AUTHKEY: ${{ secrets.HEADSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error::HEADSCALE_AUTHKEY is unset, so this job cannot reach the phone. See the comment below this check for how to mint it."
            exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh

          # The key is ephemeral, so this node deletes itself on disconnect and
          # the control plane does not accumulate one dead node per CI run.
          #
          # HEADSCALE_AUTHKEY EXPIRES 2027-08-25.
          #
          # Nothing warns before that date. The join below simply starts
          # failing, and it looks like a network fault rather than an expiry.
          # To renew, on vpn.cloud.rfldev.de, and then UPDATE THE DATE ABOVE:
          #   headscale preauthkeys create --user 4 --tags tag:gha-runner \
          #     --ephemeral --reusable --expiration 8760h
          #   gh secret set HEADSCALE_AUTHKEY --repo RooflineAI/iree-hexagon-plugins
          # --accept-dns=false: we address the rig by its literal overlay IP, so
          # there is nothing to gain from MagicDNS, and hosted runners already
          # carry enough search domains that setting it fails noisily with
          # "Too many search domains per link". Leaving the runner's resolver
          # alone avoids an alarming log line that means nothing.
          if ! sudo tailscale up \
            --login-server=https://vpn.cloud.rfldev.de \
            --authkey="$TS_AUTHKEY" \
            --accept-dns=false \
            --hostname="gha-${GITHUB_RUN_ID}"; then
            echo "::error::Could not join the overlay. The most likely cause is an expired HEADSCALE_AUTHKEY, which was due to lapse on 2027-08-25. Re-mint it and update the date in .github/workflows/build.yml; the exact commands are in the comment above this step."
            exit 1
          fi
          tailscale status

      - name: Point adb at the phone rig
        if: env.PHONE_ACCESS == 'true'
        run: |
          # The rig runs the adb server; this job must never start its own.
          # ANDROID_SERIAL is redundant with a single phone attached and becomes
          # load-bearing the moment a second one is.
          echo "ADB_SERVER_SOCKET=tcp:100.64.0.2:5037" >> "$GITHUB_ENV"
          echo "ANDROID_SERIAL=2c82b852" >> "$GITHUB_ENV"

      - name: Check the phone is reachable
        if: env.PHONE_ACCESS == 'true'
        run: |
          adb devices -l
          # Reading the two failure modes: `unauthorized` means the phone has
          # dropped its trust of the rig's key and someone has to tap Always
          # allow on the device itself; `device not found` means something on
          # the rig is holding the phone's USB interface, usually a stray adb
          # server left behind by a bare `adb` command run there.
          adb shell getprop ro.product.model

      - name: Test
        run: |
          echo TODO

      - name: Leave the overlay
        if: always()
        run: sudo tailscale logout || true

# HuggingFaceTB/SmolLM2-135M exported for token generation (see
# models/kv_cache.py): `prefill` on the prompt, and `decode` of the next token
# against prefill's KV cache, both with dynamic sequence lengths.
# Tolerances are copied from HuggingFaceTB/SmolLM2-135M.
dtype: float16
inputs:
  # The prompt: a multiple of 32 tokens (block_seq_stride), at least two
  # blocks, and shorter than max_seq_len (128) so that decode has room.
  - shape: [1, 64]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.2
# The configuration the token-generation path is meant to run in.
compile_cases: [hexagon-vtcm-hmx]
expected_outcomes:
  - case: hexagon-vtcm-hmx
    status: COMPILE_FAILURE
    reason: "could not bound HMX matmul shapes for packing"
    comment: >-
      The dynamic sequence length of the attention matmuls is not bounded for HMX packing and VTCM planning.

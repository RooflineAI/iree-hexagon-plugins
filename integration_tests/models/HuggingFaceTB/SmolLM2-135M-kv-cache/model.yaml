# HuggingFaceTB/SmolLM2-135M exported for token generation (see
# models/kv_cache.py): `prefill` on the prompt, and `decode` of the next token
# against prefill's KV cache, both with dynamic sequence lengths.
# Tolerances are copied from HuggingFaceTB/SmolLM2-135M, except atol and
# relative_l2_percent: see below.
dtype: float16
inputs:
  # The export's example prompt: a multiple of 32 tokens (block_seq_stride),
  # at least two blocks, and shorter than max_seq_len (128) so that decode has
  # room.
  - shape: [1, 64]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
tolerances:
  atol: 3.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.5
# The configuration the token-generation path is meant to run in.
compile_cases: [hexagon-vtcm-hmx]
# Token generation with iree-run-llm, which checks the module: the first
# prompt, then the second, which continues the sequence after the first's
# tokens. The second's padded prefill and its tokens fit in max_seq_len
# (128). With these prompts, the reference's most likely token leads the
# runner-up by at least 0.52 (first prompt) and 1.1 (second) at every step,
# above min_margin (0.25), so the import accepts it.
generation:
  - prompt: "def fibonacci(n):\n"
    max_new_tokens: 32
  - prompt: "\n\ndef factorial(n):\n"
    max_new_tokens: 16

model: HuggingFaceTB/SmolLM2-135M
revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
dtype: float16

inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones

tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.2

tags: [hexagon, llm]

expected_outcomes:

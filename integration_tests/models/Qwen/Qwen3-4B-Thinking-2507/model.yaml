dtype: float16
inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones
# Measured 2026-11-05: max abs 0.11, relative L2 0.26%.
# Matches the tolerance for Qwen3-4B
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.3
# A ~4B-parameter prefill needs longer than the default to push and run.
run_timeout: 3600
compile_cases: [hexagon-vtcm-hmx]

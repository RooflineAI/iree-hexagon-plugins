dtype: float16
inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones
# Measured 2026-11-04: max abs 0.125, relative L2 0.20%.
# Matches the tolerance for Qwen3-1.7B
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.3
run_timeout: 3600
compile_cases: [hexagon-vtcm-hmx]
# f16 weights over 2 GiB
extra_compile_flags:
  - "--iree-stream-resource-max-allocation-size=1073741824"

dtype: float16
# Log-mel features for a 4 s clip, and their mask. The prompt is baked into
# model.py and sized for exactly 400 all-valid frames.
inputs:
  - {shape: [1, 128, 400], dtype: float16, generator: normal, seed: 0}
  - {shape: [1, 400], dtype: int64, generator: ones}
# Placeholder: never reached while the compile failure below stands.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.5
compile_cases: [hexagon-vtcm-hmx]
# A 3 GB import, then ~50 min of compile before the failure below;
# micro/conv-gelu-4x32x8x50-f16 reproduces the same dispatch shape. Run with
# --run-skipped once that is fixed.
skip: "known COMPILE_FAILURE (scalarized f16 erf GELU, stack-frame gate); tracked by micro/conv-gelu-4x32x8x50-f16"
expected_outcomes:
  - case: hexagon-vtcm-hmx
    status: COMPILE_FAILURE
    reason: "stack frame exceeds the configured limit"
    comment: >-
      The audio encoder's fused f16 conv and erf-GELU dispatches scalarize division across unrolled tiles, producing heavy spilling. Compilation takes about 50 minutes, and the roughly 150 KB stack frames exceed the configured 12 KiB limit. The smaller micro/conv-gelu-4x32x8x50-f16 model reproduces this compile-cost and stack-pressure problem.

dtype: float16
# Log-mel features for a 4 s clip, and their mask. The prompt is baked into
# model.py and sized for exactly 400 all-valid frames.
inputs:
  - {shape: [1, 128, 400], dtype: float16, generator: normal, seed: 0}
  - {shape: [1, 400], dtype: int64, generator: ones}
# Not met yet: 1.50% relative L2 on device (2026-11-24), see below.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.5
compile_cases: [hexagon-vtcm-hmx]
expected_outcomes:
  - case: hexagon-vtcm-hmx
    status: COMPILE_FAILURE
    reason: "'iree_hexagon.hmx.pack' op source must be known to be 64-byte aligned"
    comment: >-
      Since the import keeps attention in f16 (model_dtype_attention), the attention batch matmuls [16, 70, 128] x [16, 128, 70] and [14, 52, 52] x [14, 52, 64] go through HMX, which cannot prove the alignment of these ragged (70, 52) shapes, as in Qwen3-VL-2B-Instruct (2026-11-27). Before that, it compiled and output0 (logits [1, 70, 151936]) was 1.50% relative L2, max abs diff 0.91. The error was spread over all 70 positions (median 1.07% per position, worst 8.5% at position 59), and the argmax agreed at all 70 positions. That accuracy failure is tracked by ROO-2494.

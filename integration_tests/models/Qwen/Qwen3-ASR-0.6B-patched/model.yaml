dtype: float16
# Log-mel features for a 4 s clip, and their mask. The prompt is baked into
# model.py and sized for exactly 400 all-valid frames.
inputs:
  - {shape: [1, 128, 400], dtype: float16, generator: normal, seed: 0}
  - {shape: [1, 400], dtype: int64, generator: ones}
# Not met yet: 1.50% relative L2 on device (2026-11-24), see below.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.5
compile_cases: [hexagon-vtcm-hmx]
skip: "known ACCURACY_FAILURE (1.50% relative L2 vs 0.5%; every argmax matches)"
expected_outcomes:
  - case: hexagon-vtcm-hmx
    status: ACCURACY_FAILURE
    reason: "allclose(atol=0.2, rtol=0.05) = False"
    comment: >-
      Output0 (logits [1, 70, 151936]) is 1.50% relative L2, max abs diff 0.91. The error is spread over all 70 positions (median 1.07% per position, worst 8.5% at position 59), and the argmax agrees at all 70 positions. Not investigated further and tracked by ROO-2494.
# The weights go to a parameter archive kept on the phone, so a run only
# pushes them when they change.
weights: [external]

# Qwen3-VL-2B-Instruct's vision encoder on a real photograph (resnet-50-keyboard's
# keyboard.png, bicubic-resized to 256x256): 64 image tokens. Four outputs, all
# checked: the merged image embeddings and the three deepstack features.
dtype: float16
inputs:
  - shape: [1, 3, 256, 256]
    dtype: float16
    generator: image
    image: keyboard-256.png
# hexagon-vtcm-hmx on device: 0.85 / 0.14 / 0.27 / 0.48% relative L2 per output
# (2026-11-24). IREE LLVMCPU on the host lands at 0.15-0.66% (2026-10-01);
# torch f16 vs f32 is 0.53%.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 1.0
compile_cases: [hexagon, hexagon-vtcm-hmx]
# The weights go to a parameter archive kept on the phone, so a run only
# pushes them when they change.
weights: [external]

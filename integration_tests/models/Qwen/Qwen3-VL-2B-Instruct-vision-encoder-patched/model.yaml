# Qwen3-VL-2B-Instruct's vision encoder on a real photograph (resnet-50-keyboard's
# keyboard.png, bicubic-resized to 256x256): 64 image tokens. Four outputs, all
# checked: the merged image embeddings and the three deepstack features.
dtype: float16
inputs:
  - shape: [1, 3, 256, 256]
    dtype: float16
    generator: image
    image: keyboard-256.png
# IREE LLVMCPU on the host lands at 0.15-0.66% relative L2 per output
# (2026-10-01); torch f16 vs f32 is 0.53%. On device (2026-10-09), hexagon
# lands at 0.73/0.15/0.29/0.46% and hexagon-vtcm-hmx at 0.72/0.19/0.32/0.70%:
# output0 has little margin under 1% in both.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 1.0
compile_cases: [hexagon, hexagon-vtcm-hmx]

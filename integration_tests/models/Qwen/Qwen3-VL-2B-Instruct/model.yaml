dtype: float16
# The vision encoder's four outputs, synthetic: the merged image embeddings and
# the three deepstack features, [64, 2048] each. Real ones (eg: keyboard_grayscale.png) have a
# std of 0.3-0.56 and peaks up to 24, so N(0, 1) is in range. The 81-token
# prompt they are scattered into is baked into model.py.
inputs:
  - {shape: [64, 2048], dtype: float16, generator: normal, seed: 0}
  - {shape: [64, 2048], dtype: float16, generator: normal, seed: 1}
  - {shape: [64, 2048], dtype: float16, generator: normal, seed: 2}
  - {shape: [64, 2048], dtype: float16, generator: normal, seed: 3}
# Measured 2026-10-01 (hexagon-vtcm-hmx): 0.32% relative L2 vs torch-f16, 100%
# top-1. That is f16 noise, not a Hexagon error: torch-f16 itself is 0.29% from
# torch-f32 on these inputs, and the device is 0.29% from f32 too.
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 0.5
# The plain `hexagon` case is ~10x slower on device
# for an LLM prefill.
compile_cases: [hexagon-vtcm-hmx]
# The weights go to a parameter archive kept on the phone, so a run only
# pushes them when they change.
weights: [external]
expected_outcomes:
  - case: hexagon-vtcm-hmx
    status: COMPILE_FAILURE
    reason: "'iree_hexagon.hmx.pack' op source must be known to be 64-byte aligned"
    comment: >-
      Since the import keeps attention in f16 (model_dtype_attention), the attention batch matmuls [16, 81, 128] x [16, 128, 81] go through HMX, which cannot prove the alignment of these ragged (81) shapes; the f32 ones never reached HMX. Reproduced with one causal f16 attention [1, 16, L, 128]: L=81 fails, L=96 and L=128 compile (2026-11-26).

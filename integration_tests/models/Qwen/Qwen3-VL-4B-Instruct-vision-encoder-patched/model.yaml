# Qwen3-VL-4B-Instruct's vision encoder on a real photograph
# (inputs/keyboard_grayscale.png, bicubic-resized to 256x256): 64 image tokens.
# Four outputs, all checked: the merged image embeddings and the three
# deepstack features.
dtype: float16
inputs:
  - shape: [1, 3, 256, 256]
    dtype: float16
    generator: image
    image: ../../../inputs/keyboard-256.png
# hexagon-vtcm-hmx on device: 0.59 / 0.14 / 0.71 / 0.69% relative L2 per output
# (2026-11-25).
tolerances:
  atol: 2.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 1.0
# Only the VTCM/HMX configuration is exercised, as for the language model.
compile_cases: [hexagon-vtcm-hmx]
# The weights go to a parameter archive kept on the phone, so a run only
# pushes them when they change.
weights: [external]

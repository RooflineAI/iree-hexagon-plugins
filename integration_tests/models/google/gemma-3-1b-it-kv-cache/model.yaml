# google/gemma-3-1b-it exported for token generation (see models/kv_cache.py): `prefill` on
# the prompt, and `decode` of the next token against prefill's KV cache, both
# with dynamic sequence lengths. Tolerances are copied from google/gemma-3-1b-it.
dtype: float16
inputs:
  # The prompt: a multiple of 32 tokens (block_seq_stride), at least two
  # blocks, and shorter than max_seq_len (128) so that decode has room.
  - shape: [1, 64]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
tolerances:
  atol: 1.5
  rtol: 5.0e-2
  relative_l2_percent: 3.5 # slightly increased tolerance compared to one-shot mode
# The configuration the token-generation path is meant to run in.
compile_cases: [hexagon-vtcm-hmx]
# Token generation with iree-run-llm, which checks the module. With this
# prompt, the reference's most likely token leads the runner-up by at least 0.87
# at every step, above min_margin (0.25), so the import accepts it.
generation:
  prompt: "The capital of France is"
  max_new_tokens: 32

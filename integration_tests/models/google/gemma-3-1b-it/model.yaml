dtype: float16
inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones
# Measured 2026-09-30: max abs 0.93, relative L2 1.64%.
tolerances:
  atol: 1.5
  rtol: 5.0e-2
  relative_l2_percent: 3.0
# The plain `hexagon` case runs ~10x slower on device for an LLM prefill,
# so only the VTCM/HMX configuration is exercised.
compile_cases: [hexagon-vtcm-hmx]
# f16 weights over 2 GiB
extra_compile_flags:
  - "--iree-stream-resource-max-allocation-size=1073741824"

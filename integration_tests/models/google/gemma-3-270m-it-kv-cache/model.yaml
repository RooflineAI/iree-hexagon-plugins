# google/gemma-3-270m-it exported for token generation (see models/kv_cache.py): `prefill` on
# the prompt, and `decode` of the next token against prefill's KV cache, both
# with dynamic sequence lengths. Tolerances are copied from google/gemma-3-270m-it.
dtype: float16
inputs:
  # The prompt: a multiple of 32 tokens (block_seq_stride), at least two
  # blocks, and shorter than max_seq_len (128) so that decode has room.
  - shape: [1, 64]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
tolerances:
  atol: 1.0
  rtol: 5.0e-2
  relative_l2_percent: 0.75
# The configuration the token-generation path is meant to run in.
compile_cases: [hexagon-vtcm-hmx]
# Token generation with iree-run-llm, which checks the module.
# In float16, the eager reference overflows to inf/NaN in the residual stream
# (layer 8) on any real, BOS-prefixed prompt, so there is no reference to
# check against.
generation:
  prompt: "def fibonacci(n):\n"
  max_new_tokens: 32
skip: "f16 reference overflows to NaN on real prompts (residual stream > 65504); no generation reference"

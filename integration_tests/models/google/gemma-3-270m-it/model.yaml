dtype: float16
inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones
# Measured 2026-09-30: max abs 0.75, relative L2 0.37%.
tolerances:
  atol: 1.0
  rtol: 5.0e-2
  relative_l2_percent: 0.75
# The plain `hexagon` case runs ~10x slower on device for an LLM prefill,
# so only the VTCM/HMX configuration is exercised.
compile_cases: [hexagon-vtcm-hmx]

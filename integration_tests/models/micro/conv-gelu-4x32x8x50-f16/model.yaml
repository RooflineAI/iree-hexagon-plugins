dtype: float16
inputs:
  - {shape: [4, 32, 8, 50], dtype: float16, generator: normal, seed: 0}
# Placeholder: never reached while the compile failure below stands.
tolerances:
  atol: 5.0e-2
  rtol: 5.0e-2
  relative_l2_percent: 1.0
# The compile spills heavily and takes 10-24 min per case before it fails (below).
# Run with --run-skipped when working on the conv strategy.
skip: "known COMPILE_FAILURE after 10-24 min per case (huge register spills in the conv+GELU dispatch)"
expected_outcomes:
  - case: "*"
    status: COMPILE_FAILURE
    reason: "Hexagon function stack frame exceeds the configured limit"
    comment: >-
      The conv strategy's vector tile spans the whole 32x25 workgroup tile, so the f32 exact-erf GELU fused into dispatch conv_4x32x4x25x32x3x3_f16xf16xf32 is unrolled op by op over 32 rows. Hundreds of row vectors stay live and spill to a 141312 B stack frame, in both cases, after 10-24 min of compilation. Since torch-mlir 71d12d55 computes the GELU in f32, this replaces the earlier "v32i1 = setcc" ISel failure. The same dispatch shape is in Qwen/Qwen3-ASR-0.6B (conv_4x480x32x25x480x3x3). Measured 2026-10-30.
run_cases: [parallel-debug-malloc]

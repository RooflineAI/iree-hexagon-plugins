dtype: float16
inputs:
  - {shape: [4, 32, 8, 50], dtype: float16, generator: normal, seed: 0}
# Placeholder: never reached while the compile failure below stands.
tolerances:
  atol: 5.0e-2
  rtol: 5.0e-2
  relative_l2_percent: 1.0
# Each case takes about 30 minutes to reach the failure below.
skip: "known COMPILE_FAILURE after ~30 min per case (scalarized f16 GELU, stack-frame gate); see expected_outcomes"
expected_outcomes:
  - case: "*"
    status: COMPILE_FAILURE
    reason: "stack frame exceeds the configured limit"
    comment: >-
      The fused f16 erf-GELU uses a 25-lane vector width. Division and f16 conversions are scalarized across an unrolled tile, producing large machine-code blocks and heavy spilling. Compilation takes about 30 minutes per case, and the roughly 146 KB stack frame exceeds the configured 12 KiB limit.

dtype: float16

inputs:
  - {shape: [4, 1024, 128], dtype: float16, generator: normal, seed: 0}
  - {shape: [4, 128, 1024], dtype: float16, generator: normal, seed: 1}

compile_cases: [hexagon-vtcm-hmx]

tolerances:
  atol: 1.5e-1
  rtol: 5.0e-3
  relative_l2_percent: 0.05

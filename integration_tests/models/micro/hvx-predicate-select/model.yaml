dtype: float32
inputs:
  - {shape: [32], dtype: bool, generator: ones}
  - {shape: [32], dtype: bool, generator: uniform, seed: 0}
  - {shape: [8, 128, 32], dtype: float32, generator: normal, seed: 1}
  - {shape: [8, 128, 32], dtype: float32, generator: normal, seed: 2}
# Selection performs no floating-point arithmetic: every bit must be preserved.
tolerances: {atol: 0.0, rtol: 0.0, relative_l2_percent: 0.0}
run_cases: [parallel, sequential]

# Qwen3-VL's interleaved M-RoPE: two strided slice assignments
# (freqs_t[..., 1:60:3] = freqs[1, ..., 1:60:3], and the same from 2). Each
# copy gathers 20 strided floats into a vector through a stack slot. The
# Hexagon packetizer once put the vector spill and the element store in one
# packet, the spill took effect last, and every strided column came out 0.
# It is a pure copy, so the result must be exact.
dtype: float32
inputs:
  - {shape: [3, 1, 96, 64], dtype: float32, generator: normal, seed: 0}
tolerances:
  atol: 0.0
  rtol: 0.0
  relative_l2_percent: 0.0

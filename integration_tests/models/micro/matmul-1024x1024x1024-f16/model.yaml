model: micro/matmul-1024x1024x1024-f16
dtype: float16

inputs:
  - {shape: [1024, 1024], dtype: float16, generator: normal, seed: 0}
  - {shape: [1024, 1024], dtype: float16, generator: normal, seed: 1}

tolerances:
  atol: 5.0e-1
  rtol: 5.0e-2
  relative_l2_percent: 1.0

tags: [hexagon, op-level]

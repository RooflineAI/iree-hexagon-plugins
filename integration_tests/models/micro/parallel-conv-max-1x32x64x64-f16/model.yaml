dtype: float16
inputs:
  - {shape: [1, 32, 64, 64], dtype: float16, generator: normal, seed: 0}
tolerances:
  atol: 5.0e-2
  rtol: 5.0e-2
  relative_l2_percent: 1.0
run_cases: [parallel, sequential, parallel-profile, sequential-profile]
# Kernel zones are named after the dispatch: main$async_dispatch_1_conv_...,
# main$async_dispatch_2_conv_... and main$async_dispatch_3_reduction_... (the max).
profile_checks:
  # The two convs are independent and run in parallel.
  - check: overlap
    run_case: parallel-profile
    args: {a: dispatch_1_conv, b: dispatch_2_conv}
  # The max reads both conv results, so it must run after both of them.
  - check: no_overlap
    args: {a: dispatch_3_reduction, b: "dispatch_[12]_conv"}

dtype: float32
inputs:
  - {shape: [2, 8], dtype: float32, generator: normal, seed: 0}
  - {shape: [2, 3], dtype: float32, generator: normal, seed: 1}
# Scatter only copies values: every bit must be preserved.
tolerances: {atol: 0.0, rtol: 0.0, relative_l2_percent: 0.0}
expected_outcomes:
  - case: "*"
    status: COMPILE_FAILURE
    reason: "exit code -11"
    comment: >-
      torch-mlir's scatter lowering indexes with the raw dim = -1 and segfaults (ROO-2038). Fixed by L-roro's 12cd592 (patches/torch-mlir/scatter_normalize_negative_dim.patch).
run_cases: [parallel, sequential]

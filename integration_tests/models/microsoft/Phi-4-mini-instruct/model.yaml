dtype: float16
inputs:
  - shape: [1, 128]
    dtype: int64
    generator: uniform
    low: 0
    high: null
    seed: 0
  - shape: [1, 128]
    dtype: int64
    generator: ones
# Measured 2026-11-05: max abs 0.5, relative L2 0.17%.
# The logits reach |275|, and torch f16 alone is up to 1.66 off torch f32 on
# these inputs, so atol has a 2x margin over the measured max abs.
tolerances:
  atol: 1.0
  rtol: 5.0e-2
  relative_l2_percent: 0.3
# A ~4B-parameter prefill needs longer than the default to push and run.
run_timeout: 3600
compile_cases: [hexagon-vtcm-hmx]
